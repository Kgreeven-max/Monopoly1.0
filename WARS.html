<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARS - The Strategic Monopoly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
        }

        /* Board Styles */
        .board-wrapper {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .game-board {
            width: 770px;
            height: 770px;
            position: relative;
            background: #c8e6c9;
            border: 2px solid #333;
        }

        /* Board squares */
        .board-square {
            position: absolute;
            background: #fafafa;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: visible;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .board-square:hover {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        /* Corner squares */
        .corner-square {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            background: #f0f0f0;
        }

        .corner-square.go {
            background: linear-gradient(135deg, #4caf50, #81c784);
            color: white;
            font-size: 24px;
            bottom: 0;
            right: 0;
        }

        .corner-square.jail {
            background: linear-gradient(135deg, #ff5722, #ff8a65);
            color: white;
            bottom: 0;
            left: 0;
        }

        .corner-square.free-parking {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
            top: 0;
            left: 0;
        }

        .corner-square.go-to-jail {
            background: linear-gradient(135deg, #f44336, #e57373);
            color: white;
            top: 0;
            right: 0;
        }

        /* Regular squares */
        .property-square {
            width: 70px;
            height: 110px;
        }

        .property-square.bottom {
            bottom: 0;
        }

        .property-square.left {
            width: 110px;
            height: 70px;
            left: 0;
        }

        .property-square.top {
            top: 0;
        }

        .property-square.right {
            width: 110px;
            height: 70px;
            right: 0;
        }

        /* Property color bars */
        .color-bar {
            height: 25px;
            width: 100%;
            border-bottom: 1px solid #333;
        }

        .property-square.left .color-bar {
            width: 25px;
            height: 100%;
            border-bottom: none;
            border-right: 1px solid #333;
        }

        .property-square.top .color-bar {
            border-bottom: none;
            border-top: 1px solid #333;
        }

        .property-square.right .color-bar {
            width: 25px;
            height: 100%;
            border-bottom: none;
            border-left: 1px solid #333;
            position: absolute;
            right: 0;
        }

        /* Property content */
        .property-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            text-align: center;
        }

        .property-name {
            font-size: 9px;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .property-price {
            font-size: 10px;
            font-weight: bold;
            color: #2e7d32;
        }

        /* Special squares */
        .special-square {
            background: #e8f5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            padding: 5px;
        }

        .railroad-square {
            background: #37474f;
            color: white;
        }

        .utility-square {
            background: #757575;
            color: white;
        }

        .tax-square {
            background: #ffebee;
            color: #c62828;
        }

        .chance-square {
            background: #ff9800;
            color: white;
        }

        .chest-square {
            background: #03a9f4;
            color: white;
        }

        /* Player tokens - FIXED TIMING */
        .token-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .player-token {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: left 300ms ease-out, top 300ms ease-out; /* Fixed timing */
            z-index: 20;
            pointer-events: auto;
        }

        .player-token.bouncing {
            animation: bounce 300ms ease-in-out; /* Fixed timing */
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        /* Center area */
        .center-area {
            position: absolute;
            top: 110px;
            left: 110px;
            width: 550px;
            height: 550px;
            background: linear-gradient(135deg, #1b5e20, #2e7d32);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: bold;
            color: #ff1744;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 10px;
        }

        /* Control Panel */
        .control-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            flex: 1;
            max-width: 400px;
        }

        .game-title {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #ff1744;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 5px;
        }

        .current-player {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .current-player h3 {
            margin-bottom: 10px;
            color: #ffcc00;
        }

        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .player-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .player-money {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .die {
            width: 60px;
            height: 60px;
            background: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .die.rolling {
            animation: roll 0.5s ease-in-out;
        }

        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .roll-button {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff1744 0%, #d50000 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .roll-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 23, 68, 0.4);
        }

        .roll-button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            background: #3a3a3a;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover:not(:disabled) {
            background: #4a4a4a;
            border-color: #777;
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.buy {
            background: #22c55e;
            border-color: #16a34a;
        }

        .action-btn.buy:hover:not(:disabled) {
            background: #16a34a;
        }

        .players-list {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .players-list h3 {
            margin-bottom: 15px;
            color: #ffcc00;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .player-item.active {
            border-color: #ffcc00;
            background: #3a3a3a;
        }

        .player-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-token-small {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .ai-badge {
            background: #666;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .game-log {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
        }

        .game-log h3 {
            margin-bottom: 10px;
            color: #ffcc00;
        }

        .log-entry {
            padding: 5px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
            border-left: 3px solid #555;
            padding-left: 10px;
        }

        .log-entry.important {
            color: #ffcc00;
            border-left-color: #ffcc00;
        }

        .property-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
        }

        .property-modal.active {
            display: block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            display: none;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.buy {
            background: #22c55e;
            color: white;
        }

        .modal-btn.buy:hover {
            background: #16a34a;
        }

        .modal-btn.cancel {
            background: #666;
            color: white;
        }

        .modal-btn.cancel:hover {
            background: #555;
        }

        /* Property owner indicator */
        .owner-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Game Board -->
        <div class="board-wrapper">
            <div class="game-board" id="gameBoard">
                <div class="center-area">WARS</div>
                <div class="token-area" id="tokenArea"></div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <h1 class="game-title">WARS</h1>
            
            <div class="current-player">
                <h3>Current Turn</h3>
                <div class="player-info">
                    <div class="player-indicator" id="currentPlayerIndicator"></div>
                    <div>
                        <div id="currentPlayerName">Player 1</div>
                        <div class="player-money" id="currentPlayerMoney">$1,500</div>
                    </div>
                </div>
            </div>

            <div class="dice-container">
                <div class="die" id="die1">?</div>
                <div class="die" id="die2">?</div>
            </div>

            <button class="roll-button" id="rollButton" onclick="rollDice()">ROLL DICE</button>

            <div class="action-buttons">
                <button class="action-btn buy" id="buyButton" onclick="buyProperty()" disabled>BUY</button>
                <button class="action-btn" id="endTurnButton" onclick="endTurn()" disabled>END TURN</button>
                <button class="action-btn" id="buildButton" onclick="buildHouse()">BUILD</button>
                <button class="action-btn" id="mortgageButton" onclick="mortgage()">MORTGAGE</button>
            </div>

            <div class="players-list">
                <h3>All Players</h3>
                <div id="playersList"></div>
            </div>

            <div class="game-log">
                <h3>Game Log</h3>
                <div id="gameLog"></div>
            </div>
        </div>
    </div>

    <!-- Property Purchase Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick=""></div>
    <div class="property-modal" id="propertyModal">
        <h3 id="modalTitle">Property Available</h3>
        <p id="modalDescription"></p>
        <div class="modal-buttons">
            <button class="modal-btn buy" onclick="confirmBuy()">BUY</button>
            <button class="modal-btn cancel" onclick="closeModal()">PASS</button>
        </div>
    </div>

    <script>
        // Game State - ADDED isMoving flag
        const gameState = {
            players: [],
            currentPlayer: 0,
            board: [],
            diceRolled: false,
            gameStarted: false,
            doublesCount: 0,
            auctionInProgress: false,
            gameOver: false,
            isMoving: false  // ADDED: Prevent concurrent movements
        };

        // Chance and Community Chest cards
        const chanceCards = [
            { text: "Advance to GO", action: "move", position: 0 },
            { text: "Bank pays you dividend of $50", action: "money", amount: 50 },
            { text: "Go back 3 spaces", action: "moveBack", spaces: 3 },
            { text: "Go to jail. Do not pass GO", action: "jail" },
            { text: "Make repairs on all your property. $25 per house", action: "repairs", house: 25, hotel: 100 },
            { text: "Pay poor tax of $15", action: "money", amount: -15 },
            { text: "Take a trip to Reading Railroad", action: "move", position: 5 },
            { text: "You have won a crossword competition. Collect $100", action: "money", amount: 100 },
            { text: "Your building loan matures. Collect $150", action: "money", amount: 150 }
        ];

        const communityChestCards = [
            { text: "Advance to GO", action: "move", position: 0 },
            { text: "Bank error in your favor. Collect $200", action: "money", amount: 200 },
            { text: "Doctor's fees. Pay $50", action: "money", amount: -50 },
            { text: "From sale of stock you get $50", action: "money", amount: 50 },
            { text: "Go to jail. Do not pass GO", action: "jail" },
            { text: "Holiday fund matures. Collect $100", action: "money", amount: 100 },
            { text: "Income tax refund. Collect $20", action: "money", amount: 20 },
            { text: "Life insurance matures. Collect $100", action: "money", amount: 100 },
            { text: "Pay hospital fees of $100", action: "money", amount: -100 },
            { text: "Pay school fees of $150", action: "money", amount: -150 },
            { text: "You inherit $100", action: "money", amount: 100 }
        ];

        // Board configuration - Traditional Monopoly layout
        const boardSpaces = [
            // Bottom row (GO to Connecticut)
            { name: "GO", type: "corner", subtype: "go" },
            { name: "Mediterranean Ave", type: "property", color: "#8B4513", price: 60, rent: 2, group: "brown" },
            { name: "Community Chest", type: "special", subtype: "chest" },
            { name: "Baltic Ave", type: "property", color: "#8B4513", price: 60, rent: 4, group: "brown" },
            { name: "Income Tax", type: "special", subtype: "tax", amount: 200 },
            { name: "Reading Railroad", type: "railroad", price: 200 },
            { name: "Oriental Ave", type: "property", color: "#87CEEB", price: 100, rent: 6, group: "lightblue" },
            { name: "Chance", type: "special", subtype: "chance" },
            { name: "Vermont Ave", type: "property", color: "#87CEEB", price: 100, rent: 6, group: "lightblue" },
            { name: "Connecticut Ave", type: "property", color: "#87CEEB", price: 120, rent: 8, group: "lightblue" },
            
            // Left side (Jail to New York)
            { name: "JAIL", type: "corner", subtype: "jail" },
            { name: "St. Charles Place", type: "property", color: "#FF1493", price: 140, rent: 10, group: "pink" },
            { name: "Electric Company", type: "utility", price: 150 },
            { name: "States Ave", type: "property", color: "#FF1493", price: 140, rent: 10, group: "pink" },
            { name: "Virginia Ave", type: "property", color: "#FF1493", price: 160, rent: 12, group: "pink" },
            { name: "Pennsylvania Railroad", type: "railroad", price: 200 },
            { name: "St. James Place", type: "property", color: "#FFA500", price: 180, rent: 14, group: "orange" },
            { name: "Community Chest", type: "special", subtype: "chest" },
            { name: "Tennessee Ave", type: "property", color: "#FFA500", price: 180, rent: 14, group: "orange" },
            { name: "New York Ave", type: "property", color: "#FFA500", price: 200, rent: 16, group: "orange" },
            
            // Top row (Free Parking to Pacific)
            { name: "FREE PARKING", type: "corner", subtype: "free-parking" },
            { name: "Kentucky Ave", type: "property", color: "#FF0000", price: 220, rent: 18, group: "red" },
            { name: "Chance", type: "special", subtype: "chance" },
            { name: "Indiana Ave", type: "property", color: "#FF0000", price: 220, rent: 18, group: "red" },
            { name: "Illinois Ave", type: "property", color: "#FF0000", price: 240, rent: 20, group: "red" },
            { name: "B&O Railroad", type: "railroad", price: 200 },
            { name: "Atlantic Ave", type: "property", color: "#FFFF00", price: 260, rent: 22, group: "yellow" },
            { name: "Ventnor Ave", type: "property", color: "#FFFF00", price: 260, rent: 22, group: "yellow" },
            { name: "Water Works", type: "utility", price: 150 },
            { name: "Marvin Gardens", type: "property", color: "#FFFF00", price: 280, rent: 24, group: "yellow" },
            
            // Right side (Go to Jail to Boardwalk)
            { name: "GO TO JAIL", type: "corner", subtype: "go-to-jail" },
            { name: "Pacific Ave", type: "property", color: "#008000", price: 300, rent: 26, group: "green" },
            { name: "North Carolina Ave", type: "property", color: "#008000", price: 300, rent: 26, group: "green" },
            { name: "Community Chest", type: "special", subtype: "chest" },
            { name: "Pennsylvania Ave", type: "property", color: "#008000", price: 320, rent: 28, group: "green" },
            { name: "Short Line", type: "railroad", price: 200 },
            { name: "Chance", type: "special", subtype: "chance" },
            { name: "Park Place", type: "property", color: "#0000FF", price: 350, rent: 35, group: "darkblue" },
            { name: "Luxury Tax", type: "special", subtype: "tax", amount: 100 },
            { name: "Boardwalk", type: "property", color: "#0000FF", price: 400, rent: 50, group: "darkblue" }
        ];

        // Player colors
        const playerColors = ["#FF0000", "#0000FF", "#00FF00", "#FFFF00", "#FF00FF", "#00FFFF"];

        // Update current player display
        function updateCurrentPlayerDisplay() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            document.getElementById('currentPlayerIndicator').style.backgroundColor = currentPlayer.color;
            document.getElementById('currentPlayerIndicator').textContent = currentPlayer.isAI ? `A${currentPlayer.id}` : "U";
            document.getElementById('currentPlayerName').textContent = currentPlayer.name;
            document.getElementById('currentPlayerMoney').textContent = `${currentPlayer.money.toLocaleString()}`;
        }

        // Update players list
        function updatePlayersList() {
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '';
            
            gameState.players.forEach((player, index) => {
                if (!player.bankrupt) {
                    const playerItem = document.createElement('div');
                    playerItem.className = 'player-item';
                    if (index === gameState.currentPlayer) {
                        playerItem.className += ' active';
                    }
                    
                    playerItem.innerHTML = `
                        <div class="player-badge">
                            <div class="player-token-small" style="background-color: ${player.color}">
                                ${player.isAI ? `A${player.id}` : "U"}
                            </div>
                            <span>${player.name}</span>
                            ${player.isAI ? '<span class="ai-badge">AI</span>' : ''}
                        </div>
                        <span>${player.money.toLocaleString()}</span>
                    `;
                    
                    playersList.appendChild(playerItem);
                }
            });
        }

        // Add to game log
        function addToLog(message, important = false) {
            const gameLog = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = important ? 'log-entry important' : 'log-entry';
            entry.textContent = message;
            gameLog.insertBefore(entry, gameLog.firstChild);
            
            // Keep only last 20 entries
            while (gameLog.children.length > 20) {
                gameLog.removeChild(gameLog.lastChild);
            }
        }

        // Initialize the game
        function initGame() {
            // Create human player
            gameState.players.push({
                id: 0,
                name: "You",
                money: 1500,
                position: 0,
                properties: [],
                color: playerColors[0],
                isAI: false,
                inJail: false,
                jailTurns: 0,
                houses: {},
                hotels: {},
                mortgaged: [],
                bankrupt: false
            });

            // Create AI players
            for (let i = 1; i <= 3; i++) {
                gameState.players.push({
                    id: i,
                    name: `AI ${i}`,
                    money: 1500,
                    position: 0,
                    properties: [],
                    color: playerColors[i],
                    isAI: true,
                    inJail: false,
                    jailTurns: 0,
                    houses: {},
                    hotels: {},
                    mortgaged: [],
                    bankrupt: false
                });
            }

            createBoard();
            updatePlayersList();
            updateCurrentPlayerDisplay();
            createPlayerTokens();
            addToLog("Game started! You go first.", true);
            gameState.gameStarted = true;
        }

        // Create the game board
        function createBoard() {
            const board = document.getElementById('gameBoard');
            
            // Add all 40 spaces
            boardSpaces.forEach((space, index) => {
                const square = document.createElement('div');
                
                // Determine square type and position
                if (space.type === "corner") {
                    square.className = `board-square corner-square ${space.subtype}`;
                    
                    if (index === 0) { // GO
                        square.style.bottom = '0';
                        square.style.right = '0';
                    } else if (index === 10) { // Jail
                        square.style.bottom = '0';
                        square.style.left = '0';
                    } else if (index === 20) { // Free Parking
                        square.style.top = '0';
                        square.style.left = '0';
                    } else if (index === 30) { // Go to Jail
                        square.style.top = '0';
                        square.style.right = '0';
                    }
                    
                    square.innerHTML = `<div>${space.name}</div>`;
                } else {
                    // Regular squares
                    let sideClass = '';
                    let left = 0, top = 0;
                    
                    if (index >= 1 && index <= 9) {
                        // Bottom row
                        sideClass = 'bottom';
                        left = 110 + (9 - index) * 70;
                        top = 660;
                    } else if (index >= 11 && index <= 19) {
                        // Left side
                        sideClass = 'left';
                        left = 0;
                        top = 110 + (19 - index) * 70;
                    } else if (index >= 21 && index <= 29) {
                        // Top row
                        sideClass = 'top';
                        left = 110 + (index - 21) * 70;
                        top = 0;
                    } else if (index >= 31 && index <= 39) {
                        // Right side
                        sideClass = 'right';
                        left = 660;
                        top = 110 + (index - 31) * 70;
                    }
                    
                    square.className = `board-square property-square ${sideClass}`;
                    square.style.left = `${left}px`;
                    square.style.top = `${top}px`;
                    
                    // Add appropriate class based on type
                    if (space.type === "special") {
                        square.className += ` special-square ${space.subtype}-square`;
                    } else if (space.type === "railroad") {
                        square.className += ' special-square railroad-square';
                    } else if (space.type === "utility") {
                        square.className += ' special-square utility-square';
                    }
                    
                    // Add content
                    if (space.type === "property") {
                        const colorBar = document.createElement('div');
                        colorBar.className = 'color-bar';
                        colorBar.style.backgroundColor = space.color;
                        
                        const content = document.createElement('div');
                        content.className = 'property-content';
                        content.innerHTML = `
                            <div class="property-name">${space.name}</div>
                            <div class="property-price">${space.price}</div>
                        `;
                        
                        if (sideClass === 'left') {
                            square.style.flexDirection = 'row';
                            square.appendChild(colorBar);
                            square.appendChild(content);
                        } else if (sideClass === 'right') {
                            square.style.flexDirection = 'row';
                            square.appendChild(content);
                            square.appendChild(colorBar);
                        } else if (sideClass === 'top') {
                            square.appendChild(content);
                            square.appendChild(colorBar);
                        } else {
                            square.appendChild(colorBar);
                            square.appendChild(content);
                        }
                    } else {
                        square.innerHTML = `<div class="property-name">${space.name}</div>`;
                        if (space.price) {
                            square.innerHTML += `<div class="property-price">${space.price}</div>`;
                        }
                    }
                }
                
                square.dataset.index = index;
                square.onclick = () => showSpaceInfo(index);
                board.appendChild(square);
            });
        }

        // Create player tokens
        function createPlayerTokens() {
            const tokenArea = document.getElementById('tokenArea');
            
            gameState.players.forEach((player, index) => {
                const token = document.createElement('div');
                token.className = 'player-token';
                token.id = `token-${index}`;
                token.style.backgroundColor = player.color;
                token.textContent = player.isAI ? `A${player.id}` : "U";
                tokenArea.appendChild(token);
                updateTokenPosition(index);
            });
        }

        // Update token position - FIXED with rounded pixels
        function updateTokenPosition(playerIndex) {
            try {
                const player = gameState.players[playerIndex];
                if (!player) return;
                
                const token = document.getElementById(`token-${playerIndex}`);
                const square = document.querySelector(`[data-index="${player.position}"]`);
                
                if (square && token) {
                    const squareRect = square.getBoundingClientRect();
                    const boardRect = document.getElementById('gameBoard').getBoundingClientRect();
                    
                    // Calculate center of square
                    let centerX = squareRect.left - boardRect.left + squareRect.width / 2;
                    let centerY = squareRect.top - boardRect.top + squareRect.height / 2;
                    
                    // Offset tokens to prevent overlap
                    const angle = (playerIndex * Math.PI * 2) / 4;
                    const offset = 15;
                    centerX += Math.cos(angle) * offset;
                    centerY += Math.sin(angle) * offset;
                    
                    // FIXED: Round to prevent sub-pixel positioning
                    token.style.left = `${Math.round(centerX - 12.5)}px`;
                    token.style.top = `${Math.round(centerY - 12.5)}px`;
                }
            } catch (error) {
                console.error('Token position error:', error);
            }
        }

        // Roll dice - FIXED with movement check
        function rollDice() {
            try {
                // FIXED: Check if movement is in progress
                if (gameState.diceRolled || gameState.gameOver || gameState.isMoving) return;
                
                const currentPlayer = gameState.players[gameState.currentPlayer];
                if (!currentPlayer) {
                    console.error('No current player found');
                    return;
                }
                
                // Handle jail
                if (currentPlayer.inJail) {
                    handleJailRoll();
                    return;
                }
                
                const die1Element = document.getElementById('die1');
                const die2Element = document.getElementById('die2');
                
                if (!die1Element || !die2Element) {
                    console.error('Dice elements not found');
                    return;
                }
                
                // Add rolling animation
                die1Element.classList.add('rolling');
                die2Element.classList.add('rolling');
                
                let rolls = 0;
                const rollInterval = setInterval(() => {
                    die1Element.textContent = Math.floor(Math.random() * 6) + 1;
                    die2Element.textContent = Math.floor(Math.random() * 6) + 1;
                    rolls++;
                    
                    if (rolls > 10) {
                        clearInterval(rollInterval);
                        
                        // Final roll
                        const die1 = Math.floor(Math.random() * 6) + 1;
                        const die2 = Math.floor(Math.random() * 6) + 1;
                        const total = die1 + die2;
                        
                        die1Element.textContent = die1;
                        die2Element.textContent = die2;
                        die1Element.classList.remove('rolling');
                        die2Element.classList.remove('rolling');
                        
                        addToLog(`${currentPlayer.name} rolled ${die1} + ${die2} = ${total}`);
                        
                        // Check for doubles
                        if (die1 === die2) {
                            gameState.doublesCount++;
                            if (gameState.doublesCount === 3) {
                                // Three doubles in a row - go to jail
                                sendToJail(currentPlayer);
                                gameState.diceRolled = true;
                                document.getElementById('rollButton').disabled = true;
                                if (currentPlayer.isAI) {
                                    setTimeout(endTurn, 1500);
                                } else {
                                    document.getElementById('endTurnButton').disabled = false;
                                }
                                return;
                            }
                            addToLog("Doubles! Roll again after this turn.", true);
                        }
                        
                        // Move player
                        movePlayer(total);
                        
                        gameState.diceRolled = true;
                        document.getElementById('rollButton').disabled = true;
                    }
                }, 100);
            } catch (error) {
                console.error('Roll dice error:', error);
                console.error('Stack trace:', error.stack);
            }
        }

        // Move player to specific position with animation
        function movePlayerToPosition(targetPosition) {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const oldPosition = currentPlayer.position;
            
            // Calculate spaces to move forward
            let spacesToMove = targetPosition - oldPosition;
            if (spacesToMove < 0) spacesToMove += 40; // Handle wrap-around
            
            // Use regular movePlayer
            movePlayer(spacesToMove);
        }
        
        // Move player backward with animation
        function movePlayerBackward(spaces) {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const token = document.getElementById(`token-${gameState.currentPlayer}`);
            
            // Set movement flag
            gameState.isMoving = true;
            
            let moveCount = 0;
            
            // Animate movement one space at a time backwards
            const moveInterval = setInterval(() => {
                if (moveCount < spaces) {
                    currentPlayer.position = (currentPlayer.position - 1 + 40) % 40;
                    updateTokenPosition(gameState.currentPlayer);
                    
                    // Add bounce effect
                    token.classList.add('bouncing');
                    setTimeout(() => token.classList.remove('bouncing'), 250);
                    
                    moveCount++;
                } else {
                    clearInterval(moveInterval);
                    
                    // Clear movement flag
                    gameState.isMoving = false;
                    
                    // Handle landing
                    handleLanding();
                }
            }, 300);
        }
        
        // Move player with animation - FIXED with movement flag and timing
        function movePlayer(spaces) {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const token = document.getElementById(`token-${gameState.currentPlayer}`);
            
            // FIXED: Set movement flag
            gameState.isMoving = true;
            
            // Calculate new position
            const oldPosition = currentPlayer.position;
            let moveCount = 0;
            
            // Animate movement one space at a time
            const moveInterval = setInterval(() => {
                if (moveCount < spaces) {
                    currentPlayer.position = (currentPlayer.position + 1) % 40;
                    updateTokenPosition(gameState.currentPlayer);
                    
                    // Add bounce effect
                    token.classList.add('bouncing');
                    // FIXED: Match timeout to animation duration (reduced to 250ms to complete before next move)
                    setTimeout(() => token.classList.remove('bouncing'), 250);
                    
                    moveCount++;
                } else {
                    clearInterval(moveInterval);
                    
                    // FIXED: Clear movement flag
                    gameState.isMoving = false;
                    
                    // Check if passed GO
                    if (currentPlayer.position < oldPosition && currentPlayer.position !== 0) {
                        currentPlayer.money += 200;
                        addToLog(`${currentPlayer.name} passed GO and collected $200!`, true);
                        updateCurrentPlayerDisplay();
                    }
                    
                    // Handle landing
                    handleLanding();
                }
            }, 300);
        }

        // Handle landing on a space
        function handleLanding() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const space = boardSpaces[currentPlayer.position];
            
            if (!space) return; // Safety check
            
            addToLog(`${currentPlayer.name} landed on ${space.name}`);
            
            if (space.type === "property" || space.type === "railroad" || space.type === "utility") {
                const owner = getPropertyOwner(currentPlayer.position);
                
                if (!owner) {
                    // Property available for purchase
                    if (currentPlayer.isAI) {
                        // AI decision
                        if (currentPlayer.money >= space.price && Math.random() > 0.3) {
                            buyPropertyForPlayer(currentPlayer, currentPlayer.position);
                        }
                        setTimeout(endTurn, 1000);
                    } else {
                        // Human player
                        document.getElementById('buyButton').disabled = false;
                        showPropertyModal(space);
                    }
                } else if (owner.id !== currentPlayer.id) {
                    // Pay rent
                    const rent = calculateRent(currentPlayer.position);
                    if (currentPlayer.money >= rent) {
                        currentPlayer.money -= rent;
                        owner.money += rent;
                        addToLog(`${currentPlayer.name} paid ${rent} rent to ${owner.name}`, true);
                        updateCurrentPlayerDisplay();
                        updatePlayersList();
                    } else {
                        // Can't afford rent - bankrupt
                        handleBankruptcy(currentPlayer, owner);
                        return;
                    }
                    
                    if (currentPlayer.isAI) {
                        setTimeout(() => {
                            if (gameState.doublesCount > 0 && !currentPlayer.inJail) {
                                gameState.diceRolled = false;
                                rollDice();
                            } else {
                                endTurn();
                            }
                        }, 1500);
                    } else {
                        if (gameState.doublesCount > 0 && !currentPlayer.inJail) {
                            gameState.diceRolled = false;
                            document.getElementById('rollButton').disabled = false;
                        } else {
                            document.getElementById('endTurnButton').disabled = false;
                        }
                    }
                } else {
                    // Own property
                    if (currentPlayer.isAI) {
                        setTimeout(() => {
                            if (gameState.doublesCount > 0) {
                                gameState.diceRolled = false;
                                rollDice();
                            } else {
                                endTurn();
                            }
                        }, 1000);
                    } else {
                        if (gameState.doublesCount > 0) {
                            gameState.diceRolled = false;
                            document.getElementById('rollButton').disabled = false;
                        } else {
                            document.getElementById('endTurnButton').disabled = false;
                        }
                    }
                }
            } else if (space.subtype === "go-to-jail") {
                // Go to jail
                sendToJail(currentPlayer);
                
                if (currentPlayer.isAI) {
                    setTimeout(endTurn, 1500);
                } else {
                    document.getElementById('endTurnButton').disabled = false;
                }
            } else if (space.subtype === "tax") {
                // Pay tax
                if (currentPlayer.money >= space.amount) {
                    currentPlayer.money -= space.amount;
                    addToLog(`${currentPlayer.name} paid ${space.amount} in taxes`);
                    updateCurrentPlayerDisplay();
                } else {
                    handleBankruptcy(currentPlayer, null);
                    return;
                }
                
                if (currentPlayer.isAI) {
                    setTimeout(() => {
                        if (gameState.doublesCount > 0) {
                            gameState.diceRolled = false;
                            rollDice();
                        } else {
                            endTurn();
                        }
                    }, 1000);
                } else {
                    if (gameState.doublesCount > 0) {
                        gameState.diceRolled = false;
                        document.getElementById('rollButton').disabled = false;
                    } else {
                        document.getElementById('endTurnButton').disabled = false;
                    }
                }
            } else if (space.subtype === "chance" || space.subtype === "chest") {
                // Draw card
                handleCard(space.subtype);
            } else {
                // Other spaces (Free Parking, etc.)
                if (currentPlayer.isAI) {
                    setTimeout(() => {
                        if (gameState.doublesCount > 0) {
                            gameState.diceRolled = false;
                            rollDice();
                        } else {
                            endTurn();
                        }
                    }, 1000);
                } else {
                    if (gameState.doublesCount > 0) {
                        gameState.diceRolled = false;
                        document.getElementById('rollButton').disabled = false;
                    } else {
                        document.getElementById('endTurnButton').disabled = false;
                    }

        // Get property owner
        function getPropertyOwner(position) {
            for (let player of gameState.players) {
                if (player.properties.includes(position)) {
                    return player;
                }
            }
            return null;
        }

        // Calculate rent
        function calculateRent(position) {
            const space = boardSpaces[position];
            const owner = getPropertyOwner(position);
            
            if (!owner || !space) return 0; // Safety check
            
            // Check if property is mortgaged
            if (owner.mortgaged && owner.mortgaged.includes(position)) {
                return 0;
            }
            
            if (space.type === "railroad") {
                const railroadCount = owner.properties.filter(p => 
                    boardSpaces[p] && boardSpaces[p].type === "railroad" && 
                    (!owner.mortgaged || !owner.mortgaged.includes(p))
                ).length;
                return 25 * Math.pow(2, railroadCount - 1);
            } else if (space.type === "utility") {
                const utilityCount = owner.properties.filter(p => 
                    boardSpaces[p] && boardSpaces[p].type === "utility" && 
                    (!owner.mortgaged || !owner.mortgaged.includes(p))
                ).length;
                const die1 = document.getElementById('die1').textContent;
                const die2 = document.getElementById('die2').textContent;
                const lastDiceRoll = (parseInt(die1) || 0) + (parseInt(die2) || 0);
                return utilityCount === 2 ? lastDiceRoll * 10 : lastDiceRoll * 4;
            } else {
                // Regular property
                let baseRent = space.rent || 0;
                
                // Check for monopoly
                if (space.group && hasMonopoly(owner, space.group)) {
                    // Check for houses/hotels
                    const houses = owner.houses[position] || 0;
                    const hotels = owner.hotels[position] || 0;
                    
                    if (hotels > 0) {
                        baseRent = space.rent * 50; // Hotel rent
                    } else if (houses > 0) {
                        baseRent = space.rent * (1 + houses * 5); // House rent multiplier
                    } else {
                        baseRent = space.rent * 2; // Double rent for monopoly
                    }
                }
                
                return baseRent;
            }
        }

        // Check if player has monopoly
        function hasMonopoly(player, colorGroup) {
            if (!player || !colorGroup) return false; // Safety check
            
            const groupProperties = [];
            boardSpaces.forEach((space, index) => {
                if (space && space.type === "property" && space.group === colorGroup) {
                    groupProperties.push(index);
                }
            });
            
            if (groupProperties.length === 0) return false;
            
            return groupProperties.every(index => player.properties.includes(index));
        }

        // Handle jail roll
        function handleJailRoll() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const die1Element = document.getElementById('die1');
            const die2Element = document.getElementById('die2');
            
            // Add rolling animation
            die1Element.classList.add('rolling');
            die2Element.classList.add('rolling');
            
            let rolls = 0;
            const rollInterval = setInterval(() => {
                die1Element.textContent = Math.floor(Math.random() * 6) + 1;
                die2Element.textContent = Math.floor(Math.random() * 6) + 1;
                rolls++;
                
                if (rolls > 10) {
                    clearInterval(rollInterval);
                    
                    // Final roll
                    const die1 = Math.floor(Math.random() * 6) + 1;
                    const die2 = Math.floor(Math.random() * 6) + 1;
                    
                    die1Element.textContent = die1;
                    die2Element.textContent = die2;
                    die1Element.classList.remove('rolling');
                    die2Element.classList.remove('rolling');
                    
                    currentPlayer.jailTurns++;
                    
                    if (die1 === die2) {
                        // Rolled doubles - get out of jail
                        currentPlayer.inJail = false;
                        currentPlayer.jailTurns = 0;
                        addToLog(`${currentPlayer.name} rolled doubles and got out of jail!`, true);
                        
                        const total = die1 + die2;
                        movePlayer(total);
                    } else if (currentPlayer.jailTurns >= 3) {
                        // Third turn in jail - must pay fine
                        currentPlayer.money -= 50;
                        currentPlayer.inJail = false;
                        currentPlayer.jailTurns = 0;
                        addToLog(`${currentPlayer.name} paid $50 fine to get out of jail`, true);
                        
                        const total = die1 + die2;
                        movePlayer(total);
                    } else {
                        // Still in jail
                        addToLog(`${currentPlayer.name} is still in jail (turn ${currentPlayer.jailTurns}/3)`);
                        gameState.diceRolled = true;
                        document.getElementById('rollButton').disabled = true;
                        
                        if (currentPlayer.isAI) {
                            setTimeout(endTurn, 1500);
                        } else {
                            document.getElementById('endTurnButton').disabled = false;
                        }
                    }
                }
            }, 100);
        }

        // Send player to jail
        function sendToJail(player) {
            if (!player) return;
            
            const playerIndex = gameState.players.findIndex(p => p.id === player.id);
            const token = document.getElementById(`token-${playerIndex}`);
            
            // Add a special animation for going to jail
            if (token) {
                token.style.transition = 'all 0.8s ease-in-out';
                setTimeout(() => {
                    player.position = 10;
                    player.inJail = true;
                    player.jailTurns = 0;
                    gameState.doublesCount = 0;
                    updateTokenPosition(playerIndex);
                    
                    // Reset transition after animation
                    setTimeout(() => {
                        token.style.transition = 'left 300ms ease-out, top 300ms ease-out';
                    }, 800);
                }, 100);
            }
            
            addToLog(`${player.name} went to JAIL!`, true);
        }

        // Handle card draw - FIXED to respect isMoving flag
        function handleCard(cardType) {
            try {
                const currentPlayer = gameState.players[gameState.currentPlayer];
                const cards = cardType === "chance" ? chanceCards : communityChestCards;
                const card = cards[Math.floor(Math.random() * cards.length)];
                
                addToLog(`${currentPlayer.name} drew: "${card.text}"`, true);
                
                switch (card.action) {
                    case "move":
                        const oldPosition = currentPlayer.position;
                        // Calculate distance to move
                        let spacesToMove = card.position - oldPosition;
                        if (spacesToMove < 0) spacesToMove += 40; // Handle wrap-around
                        
                        // Check if will pass GO
                        if (card.position === 0 || spacesToMove > 0) {
                            // Will pass GO during animation
                        }
                        
                        // Use movePlayer for animated movement
                        movePlayerToPosition(card.position);
                        break;
                        
                    case "moveBack":
                        // Move backwards with animation
                        movePlayerBackward(card.spaces);
                        break;
                        
                    case "money":
                        currentPlayer.money += card.amount;
                        updateCurrentPlayerDisplay();
                        if (currentPlayer.money < 0) {
                            handleBankruptcy(currentPlayer, null);
                            return;
                        }
                        finishCardAction();
                        break;
                        
                    case "jail":
                        sendToJail(currentPlayer);
                        finishCardAction();
                        break;
                        
                    case "repairs":
                        const totalHouses = Object.values(currentPlayer.houses).reduce((a, b) => a + b, 0);
                        const totalHotels = Object.values(currentPlayer.hotels).reduce((a, b) => a + b, 0);
                        const repairCost = totalHouses * card.house + totalHotels * card.hotel;
                        if (repairCost > 0) {
                            addToLog(`${currentPlayer.name} must pay ${repairCost} in repairs`);
                            currentPlayer.money -= repairCost;
                            updateCurrentPlayerDisplay();
                            if (currentPlayer.money < 0) {
                                handleBankruptcy(currentPlayer, null);
                                return;
                            }
                        }
                        finishCardAction();
                        break;
                        
                    default:
                        finishCardAction();
                        break;
                }
            } catch (error) {
                console.error('Card handling error:', error);
                finishCardAction();
            }
        }

        // Finish card action
        function finishCardAction() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            if (currentPlayer.isAI) {
                setTimeout(() => {
                    if (gameState.doublesCount > 0 && !currentPlayer.inJail) {
                        gameState.diceRolled = false;
                        rollDice();
                    } else {
                        endTurn();
                    }
                }, 1500);
            } else {
                if (gameState.doublesCount > 0 && !currentPlayer.inJail) {
                    gameState.diceRolled = false;
                    document.getElementById('rollButton').disabled = false;
                } else {
                    document.getElementById('endTurnButton').disabled = false;
                }
            }
        }

        // Handle bankruptcy
        function handleBankruptcy(player, creditor) {
            addToLog(`${player.name} is BANKRUPT!`, true);
            
            // Transfer all assets to creditor
            if (creditor) {
                player.properties.forEach(prop => {
                    creditor.properties.push(prop);
                    // Update visual ownership
                    const square = document.querySelector(`[data-index="${prop}"]`);
                    const oldIndicator = square.querySelector('.owner-indicator');
                    if (oldIndicator) {
                        oldIndicator.style.backgroundColor = creditor.color;
                    }
                });
                creditor.money += player.money;
                addToLog(`${creditor.name} receives all of ${player.name}'s assets`, true);
            }
            
            // Remove player from game
            player.money = 0;
            player.properties = [];
            player.bankrupt = true;
            
            // Hide player token
            const token = document.getElementById(`token-${player.id}`);
            if (token) token.style.display = 'none';
            
            // Check for game over
            const activePlayers = gameState.players.filter(p => !p.bankrupt);
            if (activePlayers.length === 1) {
                gameState.gameOver = true;
                addToLog(`🎉 ${activePlayers[0].name} WINS THE GAME! 🎉`, true);
                document.getElementById('rollButton').disabled = true;
                document.getElementById('endTurnButton').disabled = true;
                alert(`${activePlayers[0].name} wins the game!`);
            } else {
                // Continue with next player
                if (!player.isAI) {
                    endTurn();
                }
            }
            
            updatePlayersList();
        }

        // Start auction
        function startAuction(position) {
            try {
                const space = boardSpaces[position];
                if (!space) return;
                
                gameState.auctionInProgress = true;
                
                let currentBid = 0;
                let highestBidder = null;
                const activePlayers = gameState.players.filter(p => !p.bankrupt);
                
                addToLog(`Auction started for ${space.name}!`, true);
                
                // Simple auction logic - each player bids once
                activePlayers.forEach(player => {
                    if (player.money > currentBid) {
                        const maxBid = Math.min(player.money, space.price * (0.5 + Math.random() * 0.5));
                        if (maxBid > currentBid && Math.random() > 0.3) {
                            currentBid = Math.floor(maxBid);
                            highestBidder = player;
                        }
                    }
                });
                
                if (highestBidder) {
                    buyPropertyForPlayer(highestBidder, position, currentBid);
                    addToLog(`${highestBidder.name} won the auction for ${currentBid}!`, true);
                } else {
                    addToLog(`No one bid on ${space.name}`, true);
                }
                
                gameState.auctionInProgress = false;
                document.getElementById('endTurnButton').disabled = false;
            } catch (error) {
                console.error('Auction error:', error);
                gameState.auctionInProgress = false;
                document.getElementById('endTurnButton').disabled = false;
            }
        }

        // Modified buy property function
        function buyPropertyForPlayer(player, position, price = null) {
            const space = boardSpaces[position];
            const actualPrice = price || space.price;
            
            player.money -= actualPrice;
            player.properties.push(position);
            
            addToLog(`${player.name} bought ${space.name} for ${actualPrice}`, true);
            updateCurrentPlayerDisplay();
            updatePlayersList();
            
            // Add owner indicator
            const square = document.querySelector(`[data-index="${position}"]`);
            if (square) {
                const ownerIndicator = document.createElement('div');
                ownerIndicator.className = 'owner-indicator';
                ownerIndicator.style.backgroundColor = player.color;
                square.appendChild(ownerIndicator);
            }
            
            // Check for monopoly
            if (space.type === "property" && hasMonopoly(player, space.group)) {
                addToLog(`${player.name} now has a monopoly on ${space.group} properties!`, true);
            }
        }

        // Buy property
        function buyProperty() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const space = boardSpaces[currentPlayer.position];
            
            if (currentPlayer.money >= space.price) {
                buyPropertyForPlayer(currentPlayer, currentPlayer.position);
                document.getElementById('buyButton').disabled = true;
                document.getElementById('endTurnButton').disabled = false;
                closeModal();
            } else {
                alert("Not enough money!");
            }
        }

        // End turn
        function endTurn() {
            // Skip bankrupt players
            do {
                gameState.currentPlayer = (gameState.currentPlayer + 1) % gameState.players.length;
            } while (gameState.players[gameState.currentPlayer].bankrupt && !gameState.gameOver);
            
            // Reset doubles count if not continuing turn
            if (gameState.doublesCount > 0 && gameState.diceRolled) {
                gameState.doublesCount = 0;
            }
            
            gameState.diceRolled = false;
            
            document.getElementById('rollButton').disabled = false;
            document.getElementById('buyButton').disabled = true;
            document.getElementById('endTurnButton').disabled = true;
            
            updateCurrentPlayerDisplay();
            updatePlayersList();
            
            // Update build button state
            updateBuildButton();
            
            // If next player is AI, automatically roll
            if (gameState.players[gameState.currentPlayer].isAI && !gameState.gameOver) {
                setTimeout(() => {
                    rollDice();
                }, 1500);
            }
        }

        // Update build button state
        function updateBuildButton() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const buildButton = document.getElementById('buildButton');
            
            // Check if player has any monopolies
            const hasAnyMonopoly = ['brown', 'lightblue', 'pink', 'orange', 'red', 'yellow', 'green', 'darkblue']
                .some(group => hasMonopoly(currentPlayer, group));
            
            buildButton.disabled = !hasAnyMonopoly || currentPlayer.isAI;
        }

        // Build houses/hotels
        function buildHouse() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const monopolyGroups = ['brown', 'lightblue', 'pink', 'orange', 'red', 'yellow', 'green', 'darkblue']
                .filter(group => hasMonopoly(currentPlayer, group));
            
            if (monopolyGroups.length === 0) {
                alert("You need a monopoly to build!");
                return;
            }
            
            // Simple building interface
            let buildOptions = "Choose a property to build on:\n\n";
            const buildableProperties = [];
            
            monopolyGroups.forEach(group => {
                const groupProperties = boardSpaces.filter((space, index) => 
                    space.type === "property" && 
                    space.group === group && 
                    currentPlayer.properties.includes(index) &&
                    !currentPlayer.mortgaged.includes(index)
                );
                
                groupProperties.forEach((space, i) => {
                    const index = boardSpaces.indexOf(space);
                    const houses = currentPlayer.houses[index] || 0;
                    const hotels = currentPlayer.hotels[index] || 0;
                    
                    if (hotels < 1 && houses < 4) {
                        const cost = hotels === 0 && houses === 4 ? 50 : 50; // Simplified cost
                        buildableProperties.push({ index, space, cost, houses, hotels });
                        buildOptions += `${buildableProperties.length}. ${space.name} (${houses} houses, ${hotels} hotels) - ${cost}\n`;
                    }
                });
            });
            
            if (buildableProperties.length === 0) {
                alert("All your properties are fully developed!");
                return;
            }
            
            const choice = prompt(buildOptions + "\nEnter number (or cancel):");
            if (choice && !isNaN(choice)) {
                const selected = buildableProperties[parseInt(choice) - 1];
                if (selected && currentPlayer.money >= selected.cost) {
                    currentPlayer.money -= selected.cost;
                    
                    if (selected.houses === 4) {
                        // Build hotel
                        currentPlayer.hotels[selected.index] = 1;
                        currentPlayer.houses[selected.index] = 0;
                        addToLog(`${currentPlayer.name} built a hotel on ${selected.space.name}`, true);
                    } else {
                        // Build house
                        currentPlayer.houses[selected.index] = (selected.houses || 0) + 1;
                        addToLog(`${currentPlayer.name} built a house on ${selected.space.name}`, true);
                    }
                    
                    updateCurrentPlayerDisplay();
                } else {
                    alert("Invalid choice or not enough money!");
                }
            }
        }

        // Mortgage properties
        function mortgage() {
            const currentPlayer = gameState.players[gameState.currentPlayer];
            
            if (currentPlayer.properties.length === 0) {
                alert("You don't own any properties!");
                return;
            }
            
            let mortgageOptions = "Choose a property to mortgage/unmortgage:\n\n";
            const mortgageableProps = [];
            
            currentPlayer.properties.forEach(propIndex => {
                const space = boardSpaces[propIndex];
                const isMortgaged = currentPlayer.mortgaged.includes(propIndex);
                const houses = currentPlayer.houses[propIndex] || 0;
                const hotels = currentPlayer.hotels[propIndex] || 0;
                
                if (!isMortgaged && houses === 0 && hotels === 0) {
                    // Can mortgage
                    const value = Math.floor(space.price / 2);
                    mortgageableProps.push({ index: propIndex, space, value, action: 'mortgage' });
                    mortgageOptions += `${mortgageableProps.length}. Mortgage ${space.name} for ${value}\n`;
                } else if (isMortgaged) {
                    // Can unmortgage
                    const cost = Math.floor(space.price * 0.55); // 10% interest
                    if (currentPlayer.money >= cost) {
                        mortgageableProps.push({ index: propIndex, space, value: cost, action: 'unmortgage' });
                        mortgageOptions += `${mortgageableProps.length}. Unmortgage ${space.name} for ${cost}\n`;
                    }
                }
            });
            
            if (mortgageableProps.length === 0) {
                alert("No properties available to mortgage/unmortgage!");
                return;
            }
            
            const choice = prompt(mortgageOptions + "\nEnter number (or cancel):");
            if (choice && !isNaN(choice)) {
                const selected = mortgageableProps[parseInt(choice) - 1];
                if (selected) {
                    if (selected.action === 'mortgage') {
                        currentPlayer.money += selected.value;
                        currentPlayer.mortgaged.push(selected.index);
                        addToLog(`${currentPlayer.name} mortgaged ${selected.space.name} for ${selected.value}`, true);
                        
                        // Update visual
                        const square = document.querySelector(`[data-index="${selected.index}"]`);
                        if (square) square.style.opacity = '0.5';
                    } else {
                        currentPlayer.money -= selected.value;
                        currentPlayer.mortgaged = currentPlayer.mortgaged.filter(i => i !== selected.index);
                        addToLog(`${currentPlayer.name} unmortgaged ${selected.space.name} for ${selected.value}`, true);
                        
                        // Update visual
                        const square = document.querySelector(`[data-index="${selected.index}"]`);
                        if (square) square.style.opacity = '1';
                    }
                    
                    updateCurrentPlayerDisplay();
                }
            }
        }

        // Show property modal with auction option
        function showPropertyModal(space) {
            document.getElementById('modalTitle').textContent = space.name;
            document.getElementById('modalDescription').textContent = `Price: ${space.price} | Rent: ${space.rent || 'Varies'}`;
            document.getElementById('propertyModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('propertyModal').classList.remove('active');
            document.getElementById('modalOverlay').classList.remove('active');
            
            const currentPlayer = gameState.players[gameState.currentPlayer];
            const space = boardSpaces[currentPlayer.position];
            
            // Start auction if player doesn't buy
            if (space.type === "property" || space.type === "railroad" || space.type === "utility") {
                if (!getPropertyOwner(currentPlayer.position)) {
                    startAuction(currentPlayer.position);
                    return;
                }
            }
            
            document.getElementById('endTurnButton').disabled = false;
        }

        // Show space info
        function showSpaceInfo(index) {
            const space = boardSpaces[index];
            const owner = getPropertyOwner(index);
            
            if (owner) {
                const isMortgaged = owner.mortgaged.includes(index);
                const houses = owner.houses[index] || 0;
                const hotels = owner.hotels[index] || 0;
                
                let status = `${space.name} is owned by ${owner.name}`;
                if (isMortgaged) status += " (MORTGAGED)";
                if (hotels > 0) status += " with 1 HOTEL";
                else if (houses > 0) status += ` with ${houses} HOUSES`;
                
                addToLog(status);
            }
        }

        // Confirm buy
        function confirmBuy() {
            buyProperty();
        }

        // Initialize game on load
        window.onload = function() {
            try {
                initGame();
            } catch (error) {
                console.error('Game initialization error:', error);
                console.error('Stack trace:', error.stack);
            }
        };
        
        // Make functions globally accessible for onclick handlers
        window.rollDice = rollDice;
        window.buyProperty = buyProperty;
        window.endTurn = endTurn;
        window.buildHouse = buildHouse;
        window.mortgage = mortgage;
        window.confirmBuy = confirmBuy;
        window.closeModal = closeModal;
        window.showSpaceInfo = showSpaceInfo;
    </script>
</body>
</html>
